[project]
name = "interaction-models"
version = "0.3.0"
description = "Spatial interaction and accessibility estimators over a demand-to-supply cost matrix"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Reece Valentine", email = "reece.c.valentine@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "accessibility",
    "spatial-interaction",
    "floating-catchment-area",
    "2sfca",
    "3sfca",
    "facility-location",
    "geospatial",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/ReeeceVal/accessibility-models"
Documentation = "https://github.com/ReeeceVal/accessibility-models/tree/main/docs"
Issues = "https://github.com/ReeeceVal/accessibility-models/issues"
Changelog = "https://github.com/ReeeceVal/accessibility-models/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
# Code blocks in the docs are hand-aligned for reading; leave them alone.
exclude = ["*.md"]
