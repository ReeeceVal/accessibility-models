site_name: interaction-models
site_description: Spatial interaction and accessibility estimators over a demand-to-supply cost matrix
docs_dir: docs
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Inputs:
      - Data contract: data-contract.md
      - Modes: modes.md
      - Pipeline: pipeline.md
  - Families:
      - Catchment: families/catchment.md
      - Voronoi: families/voronoi.md
      - iFCA: families/ifca.md
      - 3SFCA: families/sfca.md
  - Reference:
      - Outputs: outputs.md
      - Stats: stats.md
      - Sweep: sweep.md
